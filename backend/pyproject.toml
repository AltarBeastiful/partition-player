[project]
name = "partition-player"
version = "0.1.0"
description = "Photo of a printed score in, MusicXML and piano playback out."
requires-python = ">=3.11,<3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "homr>=0.7,<0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
partition-player = "partition_player.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["partition_player"]

[tool.pytest.ini_options]
markers = ["slow: needs the OCR models (about 10 s)"]
testpaths = ["tests"]

